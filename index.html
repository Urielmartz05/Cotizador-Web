<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba</title>
</head>
<body>

    <header>
        <div class="logo">Logo</div>
        <div class="menu-nav">
            <ul>
                <li><a href="">Inicio</a></li>
                <li><a href="">Servicios</a></li>
                <li><a href="">Contacto</a></li>
            </ul>
        </div>
    </header>

    <div class="container">

        <form method="post">
            <h2>Formulario de Cotizacion</h2>

            <label for="nombre-cliente">Nombre del cliente</label>
            <br>
            <input type="text" name="nombre-cliente" id="nombre-cliente">
            <br>
            <label for="numero-pagina">Numero de paginas</label>
            <br>
            <input type="number" name="numero-pagina" id="numero-pagina">
            
            <!-- Servicios Adicionales -->
            <br><br>
            <label for="dominio">Dominio:
                <input class="form-check-input" type="checkbox" id="dominio" name="dominio" data-precio="600">
                $600
            </label>
            
            <br><br>
            <label for="dominio">Hosting:
                <input class="form-check-input" type="checkbox" id="hosting" name="hosting" data-precio="1500">
                $1500
            </label>
            
            <br><br>
            <label for="bd">Base de datos:
                <input class="form-check-input" type="checkbox" id="bd" name="bd" data-precio="7000">
                $7000
            </label>
            <br><br>

            <label for="changes">Cambios del dev:
                <input class="form-check-input" type="checkbox" id="changes" name="changes" data-precio="2000">
                $2000
            </label>
            <br><br>

            <label for="seo">SEO:
                <input class="form-check-input" type="checkbox" id="seo" name="seo" data-precio="2000">
                $2000
            </label>
            <br><br>

            <button type="button">Calcular cotizacion</button>
            <br>
            <button type="button">Limpiar</button>
            
        </form>

    </div>

    <footer>
        2026 Derechos Reservados
    </footer>
</body>
</html>
